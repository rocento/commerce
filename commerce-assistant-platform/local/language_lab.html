<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping assistant · Language lab</title>
<style>body{font:16px system-ui;background:#f4f7f5;color:#12372b;max-width:1100px;margin:40px auto;padding:0 20px}h1{font-size:32px}small{color:#52655f}main{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}section{background:white;border:1px solid #d6e3dc;border-radius:16px;padding:24px}button{cursor:pointer;background:#176448;color:white;border:0;border-radius:8px;padding:12px}input{padding:14px;border:1px solid #abc5b7;border-radius:8px;flex:1;min-width:0;font-size:16px}form{display:flex;gap:10px;margin:24px 0}.examples{display:flex;gap:8px;flex-wrap:wrap}.examples button{background:#e1ece6;color:#12372b}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:600px;overflow:auto;font-size:12px}#answer{white-space:pre-wrap;line-height:1.6}.product{padding:14px;border:1px solid #dde7e1;border-radius:8px;margin-top:12px}#status{font-size:13px;color:#52655f}@media(max-width:700px){main{grid-template-columns:1fr}}</style>
<h1>Shopping assistant · Language lab</h1><p>Try a request and inspect how engine JSON drives the assistant.</p><small>Local fixture catalog: apples, bananas, milk · USD · No real cart/order changes · No paid LLM calls</small>
<form id="form"><input id="message" aria-label="Shopping request" value="find apples" maxlength="4000" required><button id="send">Send</button></form>
<div class="examples"><button>find apples</button><button>find bananas under $5</button><button>add two apples to my cart</button><button>show my cart</button><button>add it</button><button>cancel and create order</button><button>hello</button></div>
<main><section><h2>Assistant</h2><p id="status">Ready</p><div id="answer">Send a request to begin.</div><div id="products"></div></section><section><h2>Engine & execution JSON</h2><pre id="json">{}</pre></section></main>
<script>const form=document.querySelector('#form'),input=document.querySelector('#message');document.querySelectorAll('.examples button').forEach(b=>b.onclick=()=>{input.value=b.textContent;form.requestSubmit()});form.onsubmit=async e=>{e.preventDefault();document.querySelector('#send').disabled=true;document.querySelector('#status').textContent='Resolving…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:input.value})});if(!r.ok)throw Error('Request failed: '+r.status);const d=await r.json();document.querySelector('#answer').textContent=d.message;document.querySelector('#status').textContent='Route: '+d.route+' · LLM calls: '+d.model_calls+' · Tools: '+d.tools.join(', ');document.querySelector('#json').textContent=JSON.stringify(d,null,2);const list=document.querySelector('#products');list.replaceChildren();for(const b of d.blocks||[])for(const p of b.products||[]){const card=document.createElement('div');card.className='product';card.textContent=p.name+' — '+p.price+' '+p.currency;list.append(card)}}catch(e){document.querySelector('#answer').textContent=e.message}finally{document.querySelector('#send').disabled=false}};</script></html>
