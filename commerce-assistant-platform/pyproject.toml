[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-ai-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pypdf==6.18.1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "PyJWT[crypto]==2.10.1", "psycopg[binary,pool]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy==1.19.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
