services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
      POSTGRES_DB: commerce_language
    ports:
      - "127.0.0.1:57439:5432"
    volumes:
      - commerce_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce_language"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  commerce_data:
