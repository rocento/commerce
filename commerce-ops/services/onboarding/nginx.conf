server {
    listen 80;
    server_name onboarding.rocento.com;
    return 301 https://onboarding.rocento.com$request_uri;
}
server {
    listen 443 ssl;
    server_name onboarding.rocento.com;
    ssl_certificate /opt/rocento-onboarding/config/origin.pem;
    ssl_certificate_key /opt/rocento-onboarding/config/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
