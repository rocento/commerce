global:
  scrape_interval: 10s
  evaluation_interval: 10s
scrape_configs:
  - job_name: commerce-analytics
    static_configs:
      - targets: [analytics-worker:8082]
  - job_name: commerce-gateway
    static_configs:
      - targets: [api-gateway:8080]
rule_files: [/etc/prometheus/alerts.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
