# Dedicated site: retained when the commerce deployment regenerates its site.
limit_req_zone $binary_remote_addr zone=rengine_login:1m rate=10r/m;
server {
    listen 80;
    server_name rengine.rocento.com;
    return 301 https://rengine.rocento.com$request_uri;
}
server {
    listen 443 ssl;
    server_name rengine.rocento.com;
    ssl_certificate /etc/nginx/ssl/rocento-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/rocento-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 96k;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /api/login {
        limit_req zone=rengine_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3190;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 20s;
    }
    location / {
        proxy_pass http://127.0.0.1:3190;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 110s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }
}
