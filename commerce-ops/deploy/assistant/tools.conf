server {
  listen 8081;
  server_tokens off;
  access_log off;
  error_log /dev/stderr crit;
  client_max_body_size 16k;
  client_body_timeout 5s;
  location ~ "^/v1/assistant-tools/orders/[0-9a-fA-F-]{36}$" {
    limit_except GET { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://api-gateway:8080;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
  }
  location ~ "^/v1/assistant-tools/orders/by-number/[0-9]{1,19}$" {
    limit_except GET { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://api-gateway:8080;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
  }
  location = /v1/assistant-tools/orders {
    limit_except GET { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://api-gateway:8080;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
  }
  location = /v1/assistant-tools/reorder {
    limit_except POST { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://api-gateway:8080;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 20s;
    proxy_send_timeout 5s;
  }
  location = /v1/assistant-tools/support/tickets {
    limit_except GET POST { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://api-gateway:8080;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
  }
  location ~ "^/v1/assistant-tools/support/tickets/[0-9a-fA-F-]{36}$" {
    limit_except GET { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://api-gateway:8080;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
  }
  location = /v1/assistant-tools/locations {
    limit_except GET { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://api-gateway:8080;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
  }
  location = /v1/assistant-tools/shopper {
    limit_except POST { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://api-gateway:8080;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
  }
  location ~ "^/v1/assistant-tools/baskets/[0-9a-fA-F-]{36}$" {
    limit_except GET POST { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://api-gateway:8080;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 10s;
    proxy_send_timeout 5s;
  }
  location = /v1/assistant-tools/memory {
    limit_except GET PUT { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://api-gateway:8080;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 3s;
    proxy_send_timeout 3s;
  }
  location / { return 403; }
  location = /v1/assistant-tools/cart {
    limit_except GET POST { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://api-gateway:8080;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_next_upstream off;
  }
  location = /v1/assistant-tools/cart/wishlist-transfer {
    limit_except POST { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://api-gateway:8080;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 10s;
    proxy_send_timeout 5s;
    proxy_next_upstream off;
  }
  location = /v1/assistant-tools/compound-actions {
    limit_except POST { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://api-gateway:8080;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 10s;
    proxy_send_timeout 5s;
    proxy_next_upstream off;
  }
  location = /v1/assistant-tools/compound-actions/receipt {
    limit_except POST { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://api-gateway:8080;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    proxy_next_upstream off;
  }
  location = /v1/assistant-tools/wishlist {
    limit_except GET POST DELETE { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://api-gateway:8080;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_next_upstream off;
  }
  location = /v1/assistant-tools/delivery {
    limit_except GET { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://api-gateway:8080;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
  }
}
