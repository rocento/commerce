# Fixed upstream/path; the AI container retains its internal-only network.
server {
  listen 8082;
  server_tokens off;
  access_log off;
  error_log /dev/stderr error;
  client_max_body_size 128k;
  client_body_timeout 5s;
  location = /v1/responses {
    limit_except POST { deny all; }
    # The provider-egress Docker network has IPv4 connectivity only.
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $provider https://api.openai.com;
    proxy_pass $provider/v1/responses;
    proxy_set_header Host api.openai.com;
    proxy_ssl_server_name on;
    proxy_ssl_name api.openai.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_pass_request_headers off;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type application/json;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 25s;
    proxy_send_timeout 25s;
    # Try another DNS address on connection failure. Keep non_idempotent off:
    # a POST already sent upstream must never be replayed.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;
  }
  location = /v1/embeddings {
    limit_except POST { deny all; }
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $provider https://api.openai.com;
    proxy_pass $provider/v1/embeddings;
    proxy_set_header Host api.openai.com;
    proxy_ssl_server_name on;
    proxy_ssl_name api.openai.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_pass_request_headers off;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type application/json;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 25s;
    proxy_send_timeout 25s;
    # Retry connection establishment only; never replay a sent POST.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;
  }
  location / { return 403; }
}
