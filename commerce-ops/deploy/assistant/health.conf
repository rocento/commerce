server {
  listen 8080;
  server_tokens off;
  access_log off;
  error_log /dev/stderr crit;
  location ~ ^/(health|ready)$ {
    limit_except GET { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://ai-service:8000;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
  }
  location / { return 403; }
}
