server {
  listen 8080;
  server_tokens off;
  access_log off;
  error_log /dev/stderr crit;
  client_max_body_size 16k;
  client_body_timeout 5s;
  location = /v1/chat {
    limit_except POST { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://ai-service:8000;
    proxy_pass $upstream;
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_connect_timeout 1s;
    proxy_read_timeout 30s;
    proxy_send_timeout 5s;
  }
  location = /v1/delivery-event {
    limit_except POST { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://ai-service:8000;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
  }
  location = /v1/account-deletion {
    limit_except POST { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://ai-service:8000;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 30s;
  }
  location = /v1/history {
    limit_except GET { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://ai-service:8000;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
  }
  location = /v1/metrics {
    limit_except GET { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://ai-service:8000;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
  }
  location = /v1/metrics/ack {
    limit_except POST { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://ai-service:8000;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
  }
  location = /v1/feedback {
    limit_except POST { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://ai-service:8000;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
  }
  location = /v1/insights {
    limit_except GET { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://ai-service:8000;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
  }
  location = /v1/provider-settings {
    limit_except GET POST { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://ai-service:8000;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
  }
  location = /v1/provider-settings/tracking {
    limit_except GET POST { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://ai-service:8000;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
  }
  location = /v1/provider-settings/test {
    limit_except POST { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://ai-service:8000;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 25s;
  }
  location = /v1/provider-settings/readiness {
    limit_except GET { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://ai-service:8000;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 10s;
  }
  location = /v1/provider-settings/acceptance {
    limit_except POST { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://ai-service:8000;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 25s;
  }
  location = /v1/tracking/live {
    limit_except GET { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://ai-service:8000;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
  }
  location / { return 403; }
  location ~ "^/v1/tracking(?:/[0-9a-fA-F-]{36})?$" {
    limit_except GET { deny all; }
    resolver 127.0.0.11 valid=10s;
    set $upstream http://ai-service:8000;
    proxy_pass $upstream;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
  }
}
