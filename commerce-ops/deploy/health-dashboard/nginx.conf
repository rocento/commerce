# Separate vhost: regular store configuration generation does not replace it.
limit_req_zone $binary_remote_addr zone=rocento_health_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=rocento_health_read:1m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=rocento_health_connections:1m;
server {
    listen 80;
    server_name health.rocento.com;
    return 301 https://health.rocento.com$request_uri;
}
server {
    listen 443 ssl;
    server_name health.rocento.com;
    ssl_certificate /etc/nginx/ssl/rocento-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/rocento-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4k;
    client_body_timeout 10s;
    limit_conn rocento_health_connections 12;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log /var/log/nginx/rocento-health.access.log;
    location = /api/login {
        limit_req zone=rocento_health_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host health.rocento.com;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
    }
    location / {
        limit_req zone=rocento_health_read burst=15 nodelay;
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host health.rocento.com;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
    }
}
