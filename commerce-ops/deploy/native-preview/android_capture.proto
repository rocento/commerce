// Wire-compatible subset of the Android emulator controller protocol.
// https://android.googlesource.com/platform/tools/base/+/refs/heads/mirror-goog-studio-main/emulator/proto/emulator_controller.proto
// Unknown response fields are intentionally ignored; only capture and bounded input messages are used.
syntax = "proto3";
package android.emulation.control;
message ImageFormat {
  enum ImgFormat { PNG = 0; RGBA8888 = 1; RGB888 = 2; }
  ImgFormat format = 1;
  uint32 width = 3;
  uint32 height = 4;
}
message Image {
  ImageFormat format = 1;
  uint32 width = 2;
  uint32 height = 3;
  bytes image = 4;
  uint32 seq = 5;
  uint64 timestampUs = 6;
}
message Touch {
  int32 x = 1;
  int32 y = 2;
  int32 identifier = 3;
  int32 pressure = 4;
}
message TouchEvent { repeated Touch touches = 1; int32 display = 2; }
message KeyboardEvent {
  enum KeyEventType { keydown = 0; keyup = 1; keypress = 2; }
  KeyEventType eventType = 2;
  string key = 4;
  string text = 5;
}
