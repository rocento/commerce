# Only native sessions and fixed-instance controls reach the isolated preview gateway.
location ~ "^/api/v1/merchants/[0-9a-f-]{36}/app-preview/(instance|sessions(/worker|/[0-9a-f-]{36}(/frame|/video|/input)?)?)$" {
    if ($arg_environment !~ "^(production)?$") { return 400; }
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:9085;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 300s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
