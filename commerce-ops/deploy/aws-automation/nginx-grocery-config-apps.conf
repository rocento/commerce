# Grocery runtime 1.3 configuration; Rust identity, CSRF and permissions apply.
location ~ "^/api/v1/merchants/312f9ac8-4888-4d35-92a0-e5fdb3bf59b8/app-config/(draft|validate|publish|versions|rollback|audit)$" {
 rewrite ^/api(/.*)$ $1 break;
 proxy_pass http://127.0.0.1:9085;
 proxy_set_header Host $host;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header X-Forwarded-For $remote_addr;
 add_header Cache-Control "no-store" always;
}
