# Activated only when this store has a shared-AI credentials file.
services:
  ai-postgres:
    profiles: [legacy-ai-database]
  ai-service:
    environment:
      AI_STORE_HOST: shared-ai-postgres
      AI_STORE_USER: ${SHARED_AI_STORE_USER:?Shared assistant login required}
    depends_on: !override
      commerce-language-engine:
        condition: service_healthy
  commerce-language-engine:
    environment:
      DATABASE_URL: ${SHARED_LANGUAGE_DATABASE_URL:?Shared language login required}
      CLE_SHARED_DATABASE: "true"
      LANGUAGE_ENGINE_ADMIN_DATABASE: postgres
    depends_on: !reset {}
    networks: !override [assistant-private]
