# Local test inbox only. No SMTP relay or external recipients are contacted.
services:
  analytics-worker:
    environment:
      NOTIFICATION_MODE: mailpit
  mailpit:
    image: axllent/mailpit:v1.30.6
    ports: ["127.0.0.1:8025:8025"]
    environment:
      MP_MAX_MESSAGES: "200"
    mem_limit: 128m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
  api-gateway:
    environment:
      NOTIFICATION_MODE: mailpit
      MAILPIT_URL: http://mailpit:8025
      NOTIFICATION_FROM: commerce@example.test
    depends_on:
      mailpit: {condition: service_started}
