# Same application images and APIs; separate project volumes and service network.
# docker compose -p commerce-pharmacy -f commerce-ops/compose/compose.yaml -f commerce-ops/compose/compose.pharmacy.yaml up -d --build
name: commerce-pharmacy
services:
  postgres:
    ports: !override ["127.0.0.1:57432:5432"]
  clickhouse:
    ports: !override ["127.0.0.1:60123:8123"]
  nats:
    ports: !override ["127.0.0.1:56222:4222", "127.0.0.1:60222:8222"]
  meilisearch:
    ports: !override ["127.0.0.1:59700:7700"]
  minio:
    ports: !override ["127.0.0.1:60100:9000", "127.0.0.1:60101:9001"]
  api-gateway:
    ports: !override ["127.0.0.1:60080:8080"]
    environment:
      STOREFRONT_URL: http://localhost:5473
      ALLOWED_ORIGINS: http://localhost:5473,http://localhost:5474,http://127.0.0.1:5473,http://127.0.0.1:5474,http://localhost:5173,http://localhost:5174
  storefront:
    ports: !override ["127.0.0.1:5473:5173"]
    environment:
      VITE_SALES_CHANNEL: storefront
  admin:
    ports: !override ["127.0.0.1:5474:5174"]
    environment:
      VITE_STOREFRONT_URL: http://localhost:5473
