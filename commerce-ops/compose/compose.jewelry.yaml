# Same application images and APIs; separate project volumes and service network.
# docker compose -p commerce-jewelry -f commerce-ops/compose/compose.yaml -f commerce-ops/compose/compose.jewelry.yaml up -d --build
name: commerce-jewelry
services:
  postgres:
    ports: !override ["127.0.0.1:55432:5432"]
  clickhouse:
    ports: !override ["127.0.0.1:58123:8123"]
  nats:
    ports: !override ["127.0.0.1:54222:4222", "127.0.0.1:58222:8222"]
  meilisearch:
    ports: !override ["127.0.0.1:57700:7700"]
  minio:
    ports: !override ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
  api-gateway:
    ports: !override ["127.0.0.1:58080:8080"]
    environment:
      STOREFRONT_URL: http://localhost:5273
      ALLOWED_ORIGINS: http://localhost:5273,http://localhost:5274,http://127.0.0.1:5273,http://127.0.0.1:5274,http://localhost:5173,http://localhost:5174
  storefront:
    ports: !override ["127.0.0.1:5273:5173"]
    environment:
      VITE_SALES_CHANNEL: storefront
  admin:
    ports: !override ["127.0.0.1:5274:5174"]
    environment:
      VITE_STOREFRONT_URL: http://localhost:5273
